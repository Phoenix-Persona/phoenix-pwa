name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run validation suite
        # Integration tests bind only to 127.0.0.1. They require loopback
        # networking but must not use public relays, PPQ, Breez, Blossom, or
        # Lightning services.
        run: npm run test:ci
