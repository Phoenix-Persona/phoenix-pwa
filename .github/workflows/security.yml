name: Security

on:
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production dependency audit
        run: |
          mkdir -p .tmp/security
          npm audit --omit=dev --audit-level=high --json > .tmp/security/npm-audit.json

      - name: Upload audit report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: .tmp/security/npm-audit.json
          if-no-files-found: warn
