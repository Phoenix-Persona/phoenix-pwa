name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          # Vite injects VITE_*-prefixed env vars into the bundle at build
          # time via __PHOENIX_ENV__ (see vite.config.ts → loadMergedViteEnv).
          # GitHub Actions doesn't auto-expose secrets to step env; we have
          # to map them explicitly here.
          VITE_BREEZ_API_KEY: ${{ secrets.VITE_BREEZ_API_KEY }}

      - name: Copy files to production server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          source: "dist/*"
          target: ${{ secrets.PROD_PATH }}
          strip_components: 1
