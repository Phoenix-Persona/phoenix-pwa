<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112" fill="none">
  <!--
    Imigongo-inspired tile.
    Features: bold diamond frame, central rotated square, spiral-quadrant
    triangles in each corner, and a small inner hex/diamond. Tiles seamlessly.
    Uses currentColor so callers can re-tint via CSS `color`.
  -->
  <defs>
    <pattern id="imigongo" x="0" y="0" width="112" height="112" patternUnits="userSpaceOnUse">
      <!-- outer diamond -->
      <path d="M56 4 L108 56 L56 108 L4 56 Z"
            stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.6"/>
      <!-- inner diamond -->
      <path d="M56 22 L90 56 L56 90 L22 56 Z"
            stroke="currentColor" stroke-width="1" fill="none" opacity="0.45"/>
      <!-- core square (rotated) -->
      <path d="M56 38 L74 56 L56 74 L38 56 Z"
            fill="currentColor" opacity="0.18"/>
      <path d="M56 38 L74 56 L56 74 L38 56 Z"
            stroke="currentColor" stroke-width="0.8" fill="none" opacity="0.55"/>
      <!-- spiral quadrant triangles (the imigongo signature) -->
      <path d="M56 38 L66 56 L56 56 Z" fill="currentColor" opacity="0.55"/>
      <path d="M56 74 L46 56 L56 56 Z" fill="currentColor" opacity="0.55"/>
      <!-- corner triangles forming continuous diagonal lines across the tile -->
      <path d="M0 0 L20 0 L0 20 Z" fill="currentColor" opacity="0.4"/>
      <path d="M112 0 L92 0 L112 20 Z" fill="currentColor" opacity="0.4"/>
      <path d="M0 112 L20 112 L0 92 Z" fill="currentColor" opacity="0.4"/>
      <path d="M112 112 L92 112 L112 92 Z" fill="currentColor" opacity="0.4"/>
      <!-- diagonal accents at midpoints for visual rhythm -->
      <path d="M56 0 L60 4 L56 8 L52 4 Z" fill="currentColor" opacity="0.45"/>
      <path d="M56 112 L60 108 L56 104 L52 108 Z" fill="currentColor" opacity="0.45"/>
      <path d="M0 56 L4 52 L8 56 L4 60 Z" fill="currentColor" opacity="0.45"/>
      <path d="M112 56 L108 52 L104 56 L108 60 Z" fill="currentColor" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="112" height="112" fill="url(#imigongo)" color="#a8431b"/>
</svg>
