<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <!-- Imigongo-inspired triangular spiral motif. Tiles seamlessly. -->
  <defs>
    <pattern id="p" x="0" y="0" width="96" height="96" patternUnits="userSpaceOnUse">
      <!-- Diamond outline -->
      <path d="M48 4 L92 48 L48 92 L4 48 Z" stroke="currentColor" stroke-width="1.25" fill="none" opacity="0.55"/>
      <!-- Inner diamond -->
      <path d="M48 20 L76 48 L48 76 L20 48 Z" stroke="currentColor" stroke-width="1" fill="none" opacity="0.45"/>
      <!-- Central spiral triangles (the imigongo signature) -->
      <path d="M48 32 L60 48 L48 48 Z" fill="currentColor" opacity="0.35"/>
      <path d="M48 64 L36 48 L48 48 Z" fill="currentColor" opacity="0.35"/>
      <!-- Corner triangles -->
      <path d="M0 0 L16 0 L0 16 Z" fill="currentColor" opacity="0.3"/>
      <path d="M96 0 L80 0 L96 16 Z" fill="currentColor" opacity="0.3"/>
      <path d="M0 96 L16 96 L0 80 Z" fill="currentColor" opacity="0.3"/>
      <path d="M96 96 L80 96 L96 80 Z" fill="currentColor" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="96" height="96" fill="url(#p)" color="#a8431b"/>
</svg>
